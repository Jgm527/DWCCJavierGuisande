<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ficha de alumno</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .ficha {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    h1 {
      font-size: 1.3em;
      color: #2c3e50;
      margin-top: 0;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
      box-sizing: border-box;
    }
    button {
      margin-top: 18px;
      padding: 8px 16px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1a252f;
    }
    #mensajeEstado {
      margin-top: 10px;
      color: green;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <div class="ficha">
    <h1>Ficha de alumno</h1>

    <label for="nombreAlumno">Nombre</label>
    <input type="text" id="nombreAlumno" readonly>

    <label for="notaAlumno">Nota</label>
    <input type="number" id="notaAlumno" min="0" max="10" step="0.1">

    <button onclick="guardarNota()">Guardar nota</button>

    <p id="mensajeEstado"></p>
  </div>

  <script src="script-ficha-alumno.js"></script>

</body>
</html>
